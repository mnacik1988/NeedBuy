<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>NeedBuy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#F4F1EA; --bg-grad:radial-gradient(120% 80% at 50% 0%, #FBF9F4 0%, #F1EEE6 100%);
  --surface:#FFFFFF; --surface2:#FBF9F4;
  --text:#1B1F1A; --muted:#828878; --line:#E8E4DA;
  --accent:#16A34A; --accent-ink:#0E7A37; --accent-soft:#E2F4E7;
  --danger:#DC2626; --warn:#D97706;

  /* объём: карточка — свой градиент, светлая кромка сверху и слоистая тень.
     Одна широкая тень выглядит наклейкой; три разной мягкости дают глубину. */
  --card:linear-gradient(180deg,#FFFFFF 0%,#FAF7F1 100%);
  --card-brd:rgba(45,50,38,.07);
  --card-hi:rgba(255,255,255,.95);
  --shadow:0 1px 2px rgba(45,50,38,.06), 0 4px 10px rgba(45,50,38,.07), 0 14px 28px rgba(45,50,38,.06);
  --shadow-lg:0 2px 6px rgba(45,50,38,.09), 0 12px 26px rgba(45,50,38,.13), 0 28px 56px rgba(45,50,38,.13);
  --inset:inset 0 2px 4px rgba(45,50,38,.10);
  --accent-grad:linear-gradient(180deg,#2BBB63 0%,#118C3E 100%);
  --accent-sh:0 2px 5px rgba(17,120,55,.30), 0 8px 18px rgba(17,120,55,.26);
  --r:22px;
}
html[data-theme="dark"]{
  --bg:#121418; --bg-grad:radial-gradient(120% 80% at 50% 0%, #1B1E24 0%, #0F1114 100%);
  --surface:#1E2228; --surface2:#252A31;
  --text:#EDF0EA; --muted:#8A9088; --line:#2E343C;
  --accent:#35D07C; --accent-ink:#4FE093; --accent-soft:#17321F;
  --danger:#F26B6B; --warn:#E4A14B;

  /* в темноте тень почти не видна — объём держится на светлой кромке сверху
     и на том, что карточка светлее фона */
  --card:linear-gradient(180deg,#282D35 0%,#1B1F25 100%);
  --card-brd:rgba(255,255,255,.07);
  --card-hi:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.38), 0 16px 32px rgba(0,0,0,.34);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.55);
  --inset:inset 0 2px 5px rgba(0,0,0,.45);
  --accent-grad:linear-gradient(180deg,#3FDD8A 0%,#1CA45E 100%);
  --accent-sh:0 2px 6px rgba(0,0,0,.4), 0 8px 20px rgba(28,164,94,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed; color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}

/* ---------- шапка ---------- */
/* фон шапки — тот же градиент, приклеенный к экрану, поэтому стыка с телом нет */
.hd{position:sticky;top:0;z-index:20;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.hd-row{display:flex;align-items:center;gap:10px}
.hd-title{font-size:26px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:7px;min-width:0}
.hd-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-caret{font-size:14px;color:var(--muted);flex:none}
.hd-spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--card-brd);box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi);flex:none}
.icon-btn:active{transform:translateY(1px) scale(.95);box-shadow:0 1px 3px rgba(45,50,38,.14)}
.hd-sub{margin-top:6px;color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center}
.pill-sum{margin-left:auto;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;padding:3px 10px;border-radius:20px;font-size:13px;
  box-shadow:inset 0 1px 2px rgba(45,50,38,.10),inset 0 -1px 0 rgba(255,255,255,.5)}
/* желобок утоплен, заливка выпуклая — полоса читается как физическая */
.progress{height:7px;border-radius:7px;background:var(--line);margin-top:10px;overflow:hidden;box-shadow:var(--inset)}
.progress i{display:block;height:100%;background:var(--accent-grad);border-radius:7px;transition:width .3s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 3px rgba(17,120,55,.4)}

/* ---------- чипы категорий ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-brd);
  box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip:active{transform:translateY(1px)}
.chip.on{background:var(--accent-grad);border-color:transparent;color:#fff;
  box-shadow:var(--accent-sh),inset 0 1px 0 rgba(255,255,255,.32)}

/* ---------- сетка плиток ---------- */
.wrap{flex:1;padding:8px 16px 190px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sec-h .cnt{background:var(--line);color:var(--muted);border-radius:10px;padding:1px 7px;font-size:11.5px;letter-spacing:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* плитка — главный носитель объёма: свой градиент, светлая кромка сверху,
   три тени разной мягкости (одна широкая выглядела бы наклейкой) */
.tile{position:relative;background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r);
  box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi);
  padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:152px;
  transition:transform .14s,box-shadow .14s,opacity .2s}
.tile:active{transform:translateY(2px) scale(.975);
  box-shadow:0 1px 2px rgba(45,50,38,.08),0 2px 6px rgba(45,50,38,.08),inset 0 1px 0 var(--card-hi)}
/* тень предмета рисует SVG-фильтр; css-тень поверх дала бы двойную */
.tile .art{width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.tile .art svg{width:80px;height:80px}
.tile .nm{font-weight:700;font-size:14.5px;line-height:1.25;word-break:break-word}
.tile .qt{margin-top:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.tile .pr{margin-top:2px;font-size:12px;color:var(--accent-ink);font-weight:700}
.tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--inset)}
.tile.done{opacity:.5;box-shadow:0 1px 2px rgba(45,50,38,.05),inset 0 1px 0 var(--card-hi)}
.tile.done .art{filter:grayscale(1)}
.tile.done .nm{text-decoration:line-through}
.tile.done .tick{background:var(--accent-grad);border-color:transparent;
  box-shadow:var(--accent-sh),inset 0 1px 0 rgba(255,255,255,.35)}
.tile .more{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.55}

/* ---------- пусто ---------- */
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty .big{font-size:19px;font-weight:800;color:var(--text);margin-bottom:6px}
.empty .art{margin:0 auto 18px;width:110px;height:110px;opacity:.55}
.empty .art svg{width:112px;height:112px}

/* ---------- строка ввода ---------- */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to top,var(--bg) 62%,rgba(0,0,0,0));pointer-events:none}
.addbar-in{max-width:560px;margin:0 auto;pointer-events:auto}
.addfield{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-brd);border-radius:26px;
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--card-hi);padding:6px 6px 6px 18px}
.addfield input{flex:1;border:0;outline:0;background:none;font-size:16px;padding:12px 0;min-width:0}
.addfield input::placeholder{color:var(--muted)}
.rbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--accent-soft);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(45,50,38,.07)}
.rbtn:active{transform:translateY(1px) scale(.95)}
.rbtn.go{background:var(--accent-grad);color:#fff;
  box-shadow:var(--accent-sh),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 5px rgba(0,0,0,.12)}
.rbtn.rec{background:var(--danger);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 11px rgba(220,38,38,0)}}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px;height:16px}

/* ---------- нижняя навигация ---------- */
.nav{display:flex;background:var(--card);border:1px solid var(--card-brd);border-radius:22px;
  box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi);margin-top:10px;overflow:hidden}
.nav button{flex:1;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700}
.nav button.on{color:var(--accent-ink)}
.nav button.on .ic{background:var(--accent-soft);box-shadow:inset 0 1px 2px rgba(45,50,38,.10)}
.nav .ic{width:34px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}

/* ---------- шторки ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(20,22,18,.42);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;
  box-shadow:0 -2px 6px rgba(0,0,0,.10),0 -18px 46px rgba(0,0,0,.22),inset 0 1px 0 var(--card-hi);
  padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface2);outline:0;box-shadow:var(--inset)}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--accent-grad);color:#fff;font-weight:800;font-size:16px;text-align:center;
  box-shadow:var(--accent-sh),inset 0 1px 0 rgba(255,255,255,.32)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi)}
.btn.dngr{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:0 1px 3px rgba(45,50,38,.2)}
.btn+.btn{margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:600}
.opt:last-child{border-bottom:0}
.opt .sp{flex:1}
.opt .val{color:var(--muted);font-weight:600}
.sw{width:48px;height:29px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .18s;
  box-shadow:var(--inset)}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#EDEAE3);box-shadow:0 1px 2px rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.18);transition:left .18s}
.sw.on{background:var(--accent-grad)}
.sw.on i{left:22px}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.langs button{padding:9px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px;
  box-shadow:var(--shadow),inset 0 1px 0 var(--card-hi)}
.langs button.on{background:var(--accent-grad);border-color:transparent;color:#fff;
  box-shadow:var(--accent-sh),inset 0 1px 0 rgba(255,255,255,.3)}
.listrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.listrow .nm{flex:1;font-weight:700}
.listrow .ct{color:var(--muted);font-size:13px}
.listrow.on .nm{color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 168px);z-index:80;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:14px;max-width:88%}
.toast b{color:var(--accent);cursor:pointer;font-weight:800}
.badge{background:var(--accent-soft);color:var(--accent-ink);border-radius:9px;padding:2px 8px;font-size:11.5px;font-weight:800}
.badge.pro{background:linear-gradient(120deg,#F5A623,#E0574F);color:#fff}
.mini{font-size:12.5px;color:var(--muted);line-height:1.5}
</style>

function freqBump(name, key, cat, unit){

  f[id] = f[id] || {n:name, k:key, c:cat, u:unit, cnt:0};

var NUMWORDS = {
  'один':1,'одна':1,'одно':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,
  'пару':2,'парочку':2,'дюжину':12,'полкило':0.5,'полкилограмма':0.5,'півкіло':0.5,'кило':1,'килограмм':1,'kilo':1,
  'одне':1,'одну':1,'дві':2,'чотири':4,'п’ять':5,"п'ять":5,'шість':6,'сім':7,'вісім':8,'дев’ять':9,'десять ':10,
  'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'a couple':2,'dozen':12,
  'eins':1,'zwei':2,'drei':3,'vier':4,'fünf':5,'sechs':6,'sieben':7,'acht':8,'neun':9,'zehn':10,
  'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six ':6,'sept':7,'huit':8,'neuf':9,'dix':10
};
/* числа словом, которые сами задают единицу */
var NUMUNIT = {'полкило':'kg','полкилограмма':'kg','кило':'kg','килограмм':'kg','півкіло':'kg','kilo':'kg','half a kilo':'kg'};
/* слова-команды, которые надо срезать: «купить», «нужно», «добавь» и т.п. */
var CMD = /^(?:мне\s+|нам\s+)?(?:нужно|надо|нужен|нужна|нужны|треба|потрібно|купить|купи|купуй|купімо|добавь|добавить|додай|додати|запиши|записать|взять|возьми|не забыть|надо купить|buy|get|add|need|i need|we need|to buy|pick up|kaufen|besorgen|hinzufügen|brauche|ich brauche|acheter|prendre|ajouter|il faut|j'ai besoin de|besoin de)\s+/i;
var FILLER = /^(?:же|ещё|еще|там|пожалуйста|ще|bitte|please|s'il te plaît|de la|de l'|du |des |le |la |les |a |an |the |ein |eine |einen )\s*/i;

function normNum(s){
  s = String(s).replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function unitFromWord(w){
  w = w.toLowerCase();
  for(var u in NB_UNIT_WORDS){
    var arr = NB_UNIT_WORDS[u];
    for(var i=0;i<arr.length;i++) if(w === arr[i] || w.indexOf(arr[i]) === 0) return u;
  }
  return null;
}
/* «2 кг яблок» → {qty:2, unit:'kg', name:'яблок'} */
function parseOne(raw){
  var s = String(raw||'').trim().replace(/\s+/g,' ');
  if(!s) return null;
  for(var i=0;i<3;i++){ s = s.replace(CMD,'').replace(FILLER,'').trim(); }
  if(!s) return null;

  var qty = null, unit = null;

  /* число в начале: «2 кг яблок», «3 молока» */
  var m = s.match(/^(\d+(?:[.,]\d+)?)\s*([a-zа-яёіїєґäöüß.]*)\s*(.*)$/i);
  if(m){
    qty = normNum(m[1]);
    var u = unitFromWord(m[2]||'');
    if(u){ unit = u; s = m[3]; }
    else { s = ((m[2]||'') + ' ' + m[3]).trim(); }
  } else {
    /* число словом: «два молока», «полкило яблок» */
    var w = s.split(' ')[0].toLowerCase();
    if(NUMWORDS[w]){
      qty = NUMWORDS[w];
      if(NUMUNIT[w]) unit = NUMUNIT[w];
      s = s.split(' ').slice(1).join(' ');
    }
  }
  /* число в конце: «яблоки 2 кг», «молоко 3 шт» */
  if(qty === null){
    var m2 = s.match(/^(.*?)[\s,-]+(\d+(?:[.,]\d+)?)\s*([a-zа-яёіїєґäöüß.]*)$/i);
    if(m2){
      var u2 = unitFromWord(m2[3]||'');
      if(u2 || !m2[3]){ qty = normNum(m2[2]); unit = u2; s = m2[1]; }
    }
  }
  s = s.replace(/^(?:кг|г|гр|л|мл|шт|уп|kg|g|l|ml|pcs)\s+/i,'').trim();
  s = s.replace(/^[,.\s-]+|[,.\s]+$/g,'');
  if(!s) return null;

  var hit = nbMatch(s);
  var name = s.charAt(0).toUpperCase() + s.slice(1);
  /* Если человек назвал ровно товар и ничего сверх («яблок» → «Яблоки»),
     показываем витринное название. Если добавил уточнение («куриное филе»),
     оставляем его слова — они несут смысл, которого в каталоге нет. */
  if(hit && hit.parts === hit.words){
    var canon = nbTitle(hit.key, state.lang);
    if(canon) name = canon;
  }
  return {
    name: name,
    qty: qty,
    /* единицу берём: явно названную → штуки, если просто посчитали → из каталога */
    unit: unit || (qty !== null ? 'pc' : (hit ? hit.unit : 'pc')),
    key: hit ? hit.key : '',
    cat: hit ? hit.cat : 'other'
  };
}
/* «молоко, хлеб и 2 кг яблок» → три товара.
   \b с кириллицей в JS не работает (и — не \w), поэтому союзы режем по пробелам. */
function parseMany(raw){
  var chunks = String(raw||'')
    .replace(/\n/g, ',')
    .split(/\s*[,;+]\s*|\s+(?:и|і|та|й|and|und|et|plus|плюс)\s+/i);
  var out = [];
  for(var i=0;i<chunks.length;i++){
    var p = parseOne(chunks[i]);
    if(p) out.push(p);
  }
  return out;
}

/* --------------------------- действия --------------------------- */
function addText(raw){
  var parsed = parseMany(raw);
  if(!parsed.length) return 0;
  var list = items(), added = [];
  parsed.forEach(function(p){
    /* тот же товар уже в списке и не куплен → просто увеличиваем количество */
    var same = null;
    for(var i=0;i<list.length;i++){
      var it = list[i];
      if(it.done) continue;
      if((p.key && it.key === p.key) || it.name.toLowerCase() === p.name.toLowerCase()){ same = it; break; }
    }
    if(same){
      if(p.qty !== null) same.qty = (same.qty||1) + p.qty;
      else same.qty = (same.qty||1) + 1;
      added.push(same.id);
    } else {
      var it2 = {id:uid(), name:p.name, qty:p.qty, unit:p.unit, key:p.key, cat:p.cat, price:null, note:'', done:false, at:Date.now()};
      list.push(it2); added.push(it2.id);
    }
  });
  _undo = {type:'add', ids:added};
  save();
  toast(t('added') + ': ' + parsed.length, t('undo'), doUndo);
  return parsed.length;
}
function quickAdd(name, key, cat, unit){
  var list = items();
  for(var i=0;i<list.length;i++){ if(!list[i].done && list[i].name.toLowerCase() === name.toLowerCase()){ list[i].qty = (list[i].qty||1)+1; save(); render(); return; } }
  list.push({id:uid(), name:name, qty:null, unit:unit||'pc', key:key||'', cat:cat||'other', price:null, note:'', done:false, at:Date.now()});
  save(); render();
}
function doUndo(){
  if(!_undo) return;
  var list = items();
  if(_undo.type === 'add'){
    for(var i=list.length-1;i>=0;i--) if(_undo.ids.indexOf(list[i].id) >= 0) list.splice(i,1);
  } else if(_undo.type === 'del'){
    _undo.saved.forEach(function(x){ list.splice(Math.min(x.i, list.length), 0, x.it); });
  } else if(_undo.type === 'clear'){
    curList().items = _undo.saved.slice();
  }
  _undo = null; state.toast = null; save(); render();
}
function toggleItem(id){
  var list = items();
  for(var i=0;i<list.length;i++){
    if(list[i].id === id){
      list[i].done = !list[i].done;
      if(list[i].done) freqBump(list[i].name, list[i].key, list[i].cat, list[i].unit);
      break;
    }
  }
  save(); render();
}
function delItem(id){
  var list = items();
  for(var i=0;i<list.length;i++) if(list[i].id === id){
    _undo = {type:'del', saved:[{i:i, it:list[i]}]};
    list.splice(i,1); break;
  }
  save(); state.sheet = null; render();
  toast(t('removed'), t('undo'), doUndo);
}
function clearDone(){
  var list = items(), saved = [];
  for(var i=list.length-1;i>=0;i--) if(list[i].done){ saved.push({i:i, it:list[i]}); list.splice(i,1); }
  _undo = {type:'del', saved:saved.reverse()};
  save(); state.sheet = null; render();
  toast(t('removed') + ': ' + saved.length, t('undo'), doUndo);
}
function clearAll(){
  _undo = {type:'clear', saved:items().slice()};
  curList().items = [];
  save(); state.sheet = null; render();
  toast(t('removed'), t('undo'), doUndo);
}
function toast(msg, action, fn){
  state.toast = {msg:msg, action:action, fn:fn};
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ state.toast = null; render(); }, 4200);
  render();
}

var rec = null;
function voiceLangTag(){
  var l = state.voiceLang || state.lang;
  return {ru:'ru-RU', en:'en-US', uk:'uk-UA', de:'de-DE', fr:'fr-FR'}[l] || 'ru-RU';
}
function micToggle(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ state.hint = t('noVoice'); render(); return; }
  if(state.recording){ try{ rec.stop(); }catch(e){} return; }
  rec = new SR();
  rec.lang = voiceLangTag();
  rec.interimResults = true;
  rec.continuous = false;
  var finalTx = '';
  rec.onstart = function(){ state.recording = true; state.hint = t('listen'); render(); };
  rec.onresult = function(e){
    var interim = '';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalTx += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    state.hint = (finalTx + ' ' + interim).trim() || t('listen');
    var f = document.getElementById('addinp'); if(f) f.value = (finalTx + ' ' + interim).trim();
    renderHint();
  };
  rec.onerror = function(e){
    state.recording = false;
    state.hint = (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed')) ? t('micDenied') : '';
    render();
  };
  rec.onend = function(){
    state.recording = false; state.hint = '';
    if(finalTx.trim()){ addText(finalTx); }
    var f = document.getElementById('addinp'); if(f) f.value = '';
    render();
  };
  try{ rec.start(); }catch(e){ state.recording = false; render(); }
}

      ? '<div class="addfield">'+
          '<input id="addinp" placeholder="'+t('ph')+'" autocomplete="off" autocapitalize="sentences" onkeydown="if(event.key===\'Enter\')submitAdd()">'+
          '<button class="rbtn'+(state.recording?' rec':'')+'" onclick="micToggle()">'+UI.mic+'</button>'+
          '<button class="rbtn go" onclick="submitAdd()">'+UI.plus+'</button>'+
        '</div>'+
        '<div class="hint" id="hint">'+esc(state.hint)+'</div>'
      : '')+
    '<div class="nav">'+
      '<button class="'+(state.tab==='list'?'on':'')+'" onclick="setTab(\'list\')"><span class="ic">'+UI.cart+'</span>'+t('list')+'</button>'+
      '<button class="'+(state.tab==='freq'?'on':'')+'" onclick="setTab(\'freq\')"><span class="ic">'+UI.repeat+'</span>'+t('frequent')+'</button>'+
      '<button class="'+(state.tab==='set'?'on':'')+'" onclick="setTab(\'set\')"><span class="ic">'+UI.gear+'</span>'+t('settings')+'</button>'+
    '</div>'+
  '</div></div>';
}

function renderSettings(){
  var langs = [['ru','RU'],['en','EN'],['uk','UA'],['de','DE'],['fr','FR']];
  return '<div class="wrap">'+
    '<div class="opt"><div class="sp">'+t('theme')+'</div><div class="sw'+(state.theme==='dark'?' on':'')+'" onclick="toggleTheme()"><i></i></div></div>'+
    '<div class="opt"><div class="sp">'+t('group')+'</div><div class="sw'+(state.group?' on':'')+'" onclick="toggleGroup()"><i></i></div></div>'+
    '<div class="sec-h">'+t('lang')+'</div>'+
    '<div class="langs">'+langs.map(function(l){
      return '<button class="'+(state.lang===l[0]?'on':'')+'" onclick="setLang(\''+l[0]+'\')">'+l[1]+'</button>';
    }).join('')+'</div>'+
    '<div class="sec-h">'+t('voice')+'</div>'+
    '<div class="langs"><button class="'+(!state.voiceLang?'on':'')+'" onclick="setVoiceLang(\'\')">'+t('asUi')+'</button>'+
      langs.map(function(l){
        return '<button class="'+(state.voiceLang===l[0]?'on':'')+'" onclick="setVoiceLang(\''+l[0]+'\')">'+l[1]+'</button>';
      }).join('')+'</div>'+
    '<div class="sec-h">'+t('lists')+'</div>'+
    state.lists.map(function(l,i){
      return '<div class="listrow'+(i===state.cur?' on':'')+'" onclick="pickList('+i+')">'+
        '<div class="nm">'+esc(l.name)+'</div><div class="ct">'+l.items.length+'</div></div>';
    }).join('')+
    '<button class="btn ghost" style="margin-top:14px" onclick="newList()">+ '+t('newList')+'</button>'+
    '<div class="sec-h" style="margin-top:26px">'+t('version')+'</div>'+
    '<div class="mini">NeedBuy '+APP_VERSION+' · <span class="badge">'+(WORKER_URL?'online':'offline')+'</span> <span class="badge pro">'+t('pro')+' soon</span><br>'+
    'Иллюстрации нарисованы для этого приложения — сторонних лицензий нет.</div>'+
  '</div>';
}

function renderSheet(){
  if(state.listSheet){
    return '<div class="ovl" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="grab"></div><h3>'+t('lists')+'</h3>'+
      state.lists.map(function(l,i){
        return '<div class="listrow'+(i===state.cur?' on':'')+'" onclick="pickList('+i+')">'+
          '<div class="nm">'+esc(l.name)+'</div><div class="ct">'+l.items.length+'</div></div>';
      }).join('')+
      '<button class="btn ghost" style="margin-top:14px" onclick="newList()">+ '+t('newList')+'</button>'+
    '</div></div>';
  }
  if(state.sheet === 'menu'){
    return '<div class="ovl" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="grab"></div><h3>'+esc(curList().name)+'</h3>'+
      '<button class="btn ghost" onclick="renameList()">'+t('renameList')+'</button>'+
      '<button class="btn ghost" onclick="clearDone()">'+t('clearDone')+'</button>'+
      '<button class="btn dngr" onclick="clearAll()">'+t('clearAll')+'</button>'+
      (state.lists.length>1 ? '<button class="btn dngr" onclick="delList()">'+t('delList')+'</button>' : '')+
    '</div></div>';
  }
  if(state.sheet === 'edit'){
    var it = null, list = items();
    for(var i=0;i<list.length;i++) if(list[i].id === state.editId) it = list[i];
    if(!it) return '';
    var units = ['pc','kg','g','l','ml','pack'];
    return '<div class="ovl" onclick="closeSheets()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="grab"></div>'+
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">'+
        '<div style="width:64px;height:64px;flex:none">'+itemArt(it).replace(/width="76" height="76"/,'width="64" height="64"')+'</div>'+
        '<h3 style="margin:0;flex:1">'+esc(it.name)+'</h3>'+
      '</div>'+
      '<div class="fld"><label>'+t('name')+'</label><input id="e-name" value="'+esc(it.name)+'"></div>'+
      '<div class="row2">'+
        '<div class="fld"><label>'+t('qty')+'</label><input id="e-qty" type="number" step="0.1" inputmode="decimal" value="'+(it.qty===null||it.qty===undefined?'':it.qty)+'"></div>'+
        '<div class="fld"><label>'+t('unit')+'</label><select id="e-unit">'+units.map(function(u){
          return '<option value="'+u+'"'+(it.unit===u?' selected':'')+'>'+esc(nbUnitName(u,state.lang))+'</option>';
        }).join('')+'</select></div>'+
      '</div>'+
      '<div class="fld"><label>'+t('price')+'</label><input id="e-price" type="number" step="0.01" inputmode="decimal" value="'+(it.price||'')+'"></div>'+
      '<div class="fld"><label>'+t('note')+'</label><input id="e-note" value="'+esc(it.note||'')+'"></div>'+
      '<button class="btn" onclick="saveEdit()">'+t('save')+'</button>'+
      '<button class="btn dngr" onclick="delItem(\''+it.id+'\')">'+t('del')+'</button>'+
    '</div></div>';
  }
  return '';
}

function renderToast(){
  if(!state.toast) return '';
  return '<div class="toast">'+esc(state.toast.msg)+
    (state.toast.action ? '<b onclick="_toastAct()">'+esc(state.toast.action)+'</b>' : '')+'</div>';
}
function renderHint(){
  var el = document.getElementById('hint');
  if(el) el.textContent = state.hint;
}

function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.lang = state.lang;
  var meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', state.theme === 'dark' ? '#121418' : '#F7F4EE');

  var keep = document.getElementById('addinp');
  var keepVal = keep ? keep.value : '';
  var focused = keep && document.activeElement === keep;

  var body = state.tab === 'list' ? renderListTab() : (state.tab === 'freq' ? renderFreqTab() : renderSettings());
  document.getElementById('app').innerHTML = renderHeader() + body + renderAddBar() + renderSheet() + renderToast();

  var inp = document.getElementById('addinp');
  if(inp && keepVal){ inp.value = keepVal; }
  if(inp && focused){ inp.focus(); }
}

/* --------------------------- обработчики --------------------------- */
function setTab(x){ state.tab = x; state.filter = ''; render(); }
function setFilter(c){ state.filter = c; render(); }
function toggleTheme(){ state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
function toggleGroup(){ state.group = !state.group; save(); render(); }
function setLang(l){ state.lang = l; save(); render(); }
function setVoiceLang(l){ state.voiceLang = l; save(); render(); }
function openLists(){ state.listSheet = true; render(); }
function openListMenu(){ state.sheet = 'menu'; render(); }
function closeSheets(){ state.sheet = null; state.listSheet = false; state.editId = null; render(); }
function openEdit(id){ state.sheet = 'edit'; state.editId = id; render(); }
function pickList(i){ state.cur = i; state.listSheet = false; state.filter = ''; state.tab = 'list'; save(); render(); }
function newList(){
  var n = prompt(t('listName'), t('newList'));
  if(n === null) return;
  n = n.trim(); if(!n) return;
  state.lists.push({id:uid(), name:n.slice(0,40), items:[]});
  state.cur = state.lists.length-1; state.listSheet = false; state.tab = 'list';
  save(); render();
}
function renameList(){
  var n = prompt(t('listName'), curList().name);
  if(n === null) return;
  n = n.trim(); if(!n) return;
  curList().name = n.slice(0,40); state.sheet = null; save(); render();
}
function delList(){
  if(state.lists.length < 2){ toast(t('cantDelLast')); return; }
  if(!confirm(t('sure'))) return;
  state.lists.splice(state.cur, 1);
  state.cur = 0; state.sheet = null; save(); render();
}
function submitAdd(){
  var inp = document.getElementById('addinp');
  if(!inp || !inp.value.trim()) return;
  var v = inp.value; inp.value = '';
  addText(v);
  render();
  var again = document.getElementById('addinp'); if(again) again.focus();
}
function saveEdit(){
  var list = items();
  for(var i=0;i<list.length;i++){
    if(list[i].id === state.editId){
      var it = list[i];
      var nm = (document.getElementById('e-name').value || '').trim();
      if(nm && nm !== it.name){
        it.name = nm.slice(0,60);
        var hit = nbMatch(nm);
        it.key = hit ? hit.key : '';
        it.cat = hit ? hit.cat : 'other';
      }
      var q = document.getElementById('e-qty').value;
      it.qty = q === '' ? null : parseFloat(q.replace(',','.'));
      it.unit = document.getElementById('e-unit').value;
      var p = document.getElementById('e-price').value;
      it.price = p === '' ? null : parseFloat(p.replace(',','.'));
      it.note = (document.getElementById('e-note').value || '').slice(0,140);
      break;
    }
  }
  state.sheet = null; state.editId = null; save(); render();
}

/* --------------------------- старт --------------------------- */
document.body.insertAdjacentHTML('afterbegin', nbDefsSvg());
load();
if(!state.lists.length) state.lists = [{id:'l1', name:'Продукты', items:[]}];
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
